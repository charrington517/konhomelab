version: '3.9'

services:
  backend:
    build: ./backend
    container_name: konhomelab-backend
    restart: unless-stopped

    ports:
      - "4000:4000"

    volumes:
      - ./config:/app/config

    environment:
      - NODE_ENV=production

    networks:
      - konnet

  frontend:
    build: ./frontend
    container_name: konhomelab-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - konnet

networks:
  konnet:
    driver: bridge
